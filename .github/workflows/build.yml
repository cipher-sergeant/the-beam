name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          gradle.beforeProject { p ->
            p.afterEvaluate {
              if (p.hasProperty('android')) {
                def c = p.android.compileSdk
                if (c == null || c < 36) {
                  p.android.compileSdk = 36
                }
              }
            }
          }
          EOF
          flutter create --org com.example --project-name family_safe --platforms android app
          cp -r lib pubspec.yaml app/
          P=""
          for x in INTERNET ACCESS_NETWORK_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS; do
            P="$P<uses-permission android:name=\"android.permission.$x\"/>"
          done
          sed -i "s|<application|$P<application|" app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub get
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Family Safe build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
